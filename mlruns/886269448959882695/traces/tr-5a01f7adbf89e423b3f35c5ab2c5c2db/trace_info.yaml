response_preview: '"MongoDB is a popular, document-oriented NoSQL database that stores
  data in flexible, JSON-like formats called BSON. It is designed to handle large
  volumes of unstructured or rapidly changing data, enabling fast storage, easy scalability,
  and the elimination of rigid schemas. MongoDB uses documents as its fundamental
  unit of data, which are composed of key-value pairs and resemble JSON objects. It
  groups these documents into collections, similar to tables in relational databases.
  MongoDB also features a dynamic schema, allowing documents within the same collection
  to have different fields and structures."'
